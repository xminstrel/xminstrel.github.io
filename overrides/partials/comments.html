{% if page.meta.comments != false %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>

  <script src="https://giscus.app/client.js"
          data-repo="xminstrel/xminstrel.github.io"
          data-repo-id="R_kgDOQ7oY9A"
          data-category="Announcements"
          data-category-id="DIC_kwDOQ7oY9M4C1XRo"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="preferred_color_scheme"
          data-lang="zh-CN"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>

  <script>
    var giscus = document.querySelector("script[src*=giscus]")

    // Keep Giscus in sync with the Material palette on initial load.
    var palette = __md_get("__palette")
    if (palette && typeof palette.color === "object") {
      var theme = palette.color.scheme === "slate"
        ? "transparent_dark"
        : "light"
      giscus.setAttribute("data-theme", theme)
    }

    // Update the embedded comments when the reader switches palettes.
    document.addEventListener("DOMContentLoaded", function() {
      var ref = document.querySelector("[data-md-component=palette]")
      if (!ref) return

      ref.addEventListener("change", function() {
        var palette = __md_get("__palette")
        var frame = document.querySelector(".giscus-frame")
        if (!frame || !palette || typeof palette.color !== "object") return

        var theme = palette.color.scheme === "slate"
          ? "transparent_dark"
          : "light"
        frame.contentWindow.postMessage(
          { giscus: { setConfig: { theme: theme } } },
          "https://giscus.app"
        )
      })
    })
  </script>
{% endif %}
