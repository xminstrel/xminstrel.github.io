# 自定义样式和脚本
extra_css:
  - stylesheets/extra.css?v=20260731-avatar-bookshelf
  - https://unpkg.com/katex@0/dist/katex.min.css
#主题配置
theme:
  name: material
  custom_dir: overrides
  language: zh
  favicon: assets/images/favicon.png  # 这里写从 docs 目录开始的相对路径
  icon:
    repo: fontawesome/brands/github
  font:
    text: LXGW WenKai Screen GB Screen # Share Tech
    code: JetBrains Mono
  palette: 
    # 切换日间模式 (点击右上角按钮)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal  # 主色调 (顶部栏)
      accent: teal   # 强调色 (链接、按钮)
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # 切换夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate  
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs        # 开启顶部导航栏 (像App一样)
    - navigation.top         # 返回顶部按钮
    - search.suggest         # 搜索建议
    - search.highlight       # 搜索高亮
    - navigation.indexes     # 分组标题可直接进入该分组的封面页
    - navigation.path        # 在页面顶部显示面包屑导航
    - navigation.tracking    # 滚动时自动更新地址栏的锚点
    - toc.follow             # 长文章目录跟随当前阅读位置
    - navigation.footer      # 显示“上一篇/下一篇”按钮
    - content.code.copy      # 为所有代码块添加“一键复制”按钮（小白最爱！）
    - content.code.annotate  # 允许在代码中添加注释气泡
# 元数据
plugins:
  - search    # 开启默认的搜索功能
hooks:
  - hooks/recent_notes.py
#md扩展
markdown_extensions:
  - wikilinks
  - admonition
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.mark
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra_javascript: # latex
  - javascripts/home.js?v=20260731-avatar-quotes
  - javascripts/recent-notes.js?v=20260731-cleanup
  - javascripts/toc-fold.js?v=20260731
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
  - javascripts/katex.js?v=20260731-formula-fix
# 社交媒体链接配置
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xminstrel
      name: GitHub

# 仓库链接配置
repo_url: https://github.com/xminstrel/xminstrel.github.io
repo_name: xminstrel
edit_uri: edit/main/docs/
