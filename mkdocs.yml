site_name: 赤奈良瞳的博客 | xminstrel's blog
site_author: 赤奈良瞳
site_url: 'https://xminstrel.github.io/'
# 站点基本信息
nav:
  - "🎆 首页": index.md
  - 😘 关于赤奈: about_me.md
  - 💎 AI 相关: 
    - AI工具: ai/tools.md
  - 🪡 控制相关:
    - 控制论: control/控制论/控制论.md
    - 自动控制理论:
      - 笔记: control/自动控制理论/自动控制理论.md
      - 小测复习: control/自动控制理论/小测复习.md
    - Esp32 入门: control/esp32/esp32.md
    - stm32 入门: control/stm32.md
  - 📚 ZJU-Courses:
    - 材料力学: zju-courses/材料力学/材料力学.md
    - 流体力学&传热学: zju-courses/农业生物系统传输过程/农业生物系统传输过程.md
    - 发展心理学: zju-courses/发展心理学/发展心理学.md
  - 🖼️ 其他笔记: 
    -  emm: others/index.md
# 自定义样式和脚本
extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css
extra_javascript:
  - javascripts/extra.js
  - javascripts/katex.js
#主题配置
theme:
  name: material
  custom_dir: overrides
  language: zh
  favicon: assets/images/favicon.png  # 这里写从 docs 目录开始的相对路径
  #icon:
    #repo: fontawesome/brands/github
  font:
    text: LXGW WenKai Screen GB Screen # Share Tech
    code: JetBrains Mono
  palette: 
    # 切换日间模式 (点击右上角按钮)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo  # 主色调 (顶部栏)
      accent: indigo   # 强调色 (链接、按钮)
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # 切换夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate  
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs        # 开启顶部导航栏 (像App一样)
    - navigation.sections    # 侧边栏分组
    - navigation.top         # 返回顶部按钮
    - search.suggest         # 搜索建议
    - search.highlight       # 搜索高亮
    - navigation.expand      # 默认展开左侧所有菜单，方便快速概览
    - navigation.path        # 在页面顶部显示面包屑导航
    - navigation.tracking    # 滚动时自动更新地址栏的锚点
    - navigation.footer      # 显示“上一篇/下一篇”按钮
    - content.code.copy      # 为所有代码块添加“一键复制”按钮（小白最爱！）
    - content.code.annotate  # 允许在代码中添加注释气泡
# 元数据
plugins:
  - search    # 开启默认的搜索功能
  - tags      # 开启标签系统
  - blog      # 开启博客时间轴模式
#md扩展
markdown_extensions:
  - wikilinks
  - admonition
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra_javascript: # latex
  - javascripts/extra.js
  - javascripts/katex.js                        
  - https://unpkg.com/katex@0/dist/katex.min.js   
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
# 社交媒体链接配置
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xminstrel
      name: GitHub

# 仓库链接配置
repo_url: https://github.com/xminstrel/xminstrel.github.io
repo_name: xminstrel
edit_uri: edit/main/docs/

