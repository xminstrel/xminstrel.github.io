name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jieba
          pip install "mkdocs<2.0"
          pip install mkdocs
          pip install mkdocs-material
          pip install mkdocs-glightbox
          pip install mkdocs-git-revision-date-localized-plugin
          pip install mkdocs-git-committers-plugin-2
          pip install mkdocs-git-authors-plugin
          pip install mkdocs-minify-plugin
          pip install mkdocs-add-number-plugin

      - name: Convert Obsidian Callouts
              run: |
                python -c "
                import os, re
                for root, dirs, files in os.walk('docs'):
                    for file in files:
                        if file.endswith('.md'):
                            filepath = os.path.join(root, file)
                            with open(filepath, 'r', encoding='utf-8') as f:
                                lines = f.readlines()
                            new_lines = []
                            in_callout = False
                            for line in lines:
                                match = re.match(r'^>\s*\[\!([^\]]+)\](.*)', line)
                                if match:
                                    ctype = match.group(1).strip()
                                    title = match.group(2).strip()
                                    title_str = f' \"{title}\"' if title else ''
                                    new_lines.append(f'!!! {ctype}{title_str}\n')
                                    in_callout = True
                                elif in_callout and line.startswith('>'):
                                    new_lines.append(re.sub(r'^>\s?', '    ', line))
                                else:
                                    in_callout = False
                                    new_lines.append(line)
                            with open(filepath, 'w', encoding='utf-8') as f:
                                f.writelines(new_lines)
                "

      - name: Build site
        run: mkdocs build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4